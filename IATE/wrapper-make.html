<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Base styles */
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        font-size: 14px;
        text-align: justify;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      /* Headings */
      h1,
      h2,
      h3,
      h4 {
        color: #0074bd;
      }
      
      /* Format all h1 elements like the header */
      h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 26px;
      }
      
      /* Format all h2 elements like part-heading */
      h2 {
        text-align: left;
        padding: 15px 0;
        margin: 30px 0 20px 0;
        border-bottom: 1px solid #0074bd;
        font-size: 22px;
        color: #0074bd;
        font-weight: 600;
      }

      /* Highlight box for important information */
      .highlight-box {
        background-color: #e6f3ff;
        padding: 15px;
        margin: 20px 0;
      }

      .highlight-box ul {
        margin: 0;
        padding-left: 20px;
      }

      /* Lists */
      ul,
      ol {
        text-align: left;
        margin: 15px 0;
      }

      /* Call to action buttons */
      .cta-button {
        display: inline-block;
        background-color: #0074bd;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 5px;
        margin: 10px 0;
        transition: background-color 0.3s ease;
      }

      .cta-button:hover {
        background-color: #005c94;
      }

      /* Signature section */
      .signature {
        margin-top: 30px;
        font-style: italic;
        color: #0074bd;
      }

      .signature a {
        color: #0074bd;
        text-decoration: none;
      }

      /* Logo */
      .logo {
        width: 150px;
        height: auto;
        margin-top: 20px;
        display: block;
      }

      /* Section headings - keeping this for backward compatibility */
      .part-heading {
        text-align: left;
        padding: 15px 0;
        margin: 30px 0 20px 0;
        border-bottom: 1px solid #0074bd;
      }

      .part-heading h2 {
        margin: 0;
        font-size: 22px;
        color: #0074bd;
        font-weight: 600;
      }

      hr {
       border: none;
       border-top: 1px solid #ccc;
       margin: 20px 0;
      }


    </style>
  </head>
  <body>
    {{16.Body}}
    <!-- Signature section with IATE details -->
    <div class="signature">
      <p>Kind regards,</p>
      <p> </p>
        {{16.`From Name`}}<br />
        The Institute for Arts in Therapy and Education<br />
        1 Danes Yard, Stratford, London, E15 2QL<br />
        <a href="http://www.artspsychotherapy.org">www.artspsychotherapy.org</a>
        | {{16.`From Email`}}<br />
        020 7704 2534
      </p>
      <div class="logo-container">
        <img src="https://firebasestorage.googleapis.com/v0/b/iate-org.appspot.com/o/downloads%2FIATE-logo?alt=media"
          alt="IATE Logo"
          class="logo"
        />
      </div>
    </div>
  </body>
</html>
